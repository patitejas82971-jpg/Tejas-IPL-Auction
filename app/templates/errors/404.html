{% extends "base.html" %}

{% block title %}404 - Page Not Found | IPL Auction Simulator{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="glass-card p-5 border-warning">
        <div class="display-1 fw-black text-warning mb-2">404</div>
        <div class="fs-4 text-white fw-bold mb-3">Ball Lost Out of the Park!</div>
        <p class="text-muted mb-4">
          The page or auction room you are looking for has been retired, moved, or does not exist.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('auction.index') }}" class="btn btn-gold px-4 py-2">
            <i class="fa-solid fa-house me-1"></i> Home
          </a>
          <a href="{{ url_for('auction.dashboard') }}" class="btn btn-stadium px-4 py-2">
            <i class="fa-solid fa-gauge-high me-1"></i> Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
