{% extends "base.html" %}

{% block title %}Create Auction Room - IPL Auction Simulator{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-card p-4 p-md-5 border-warning">
        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-secondary">
          <div class="team-logo-badge" style="background: linear-gradient(135deg, #F5B841, #FF7A00); color: #071A36;">
            <i class="fa-solid fa-gavel fs-4"></i>
          </div>
          <div>
            <h2 class="text-white fw-bold mb-1">Create IPL Auction Room</h2>
            <p class="text-muted small mb-0">Set up your private room, configure rules, and invite friends</p>
          </div>
        </div>

        <form method="POST" action="{{ url_for('auction.create_auction') }}" id="createAuctionForm">
          <!-- Room Name & Host Info -->
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="room_name" class="form-label">Auction Room Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="room_name" name="room_name" placeholder="e.g. IPL Mega Auction 2026" required autofocus value="IPL Mega Auction 2026">
            </div>
            <div class="col-md-4">
              <label class="form-label">Host Username</label>
              <input type="text" class="form-control bg-dark text-muted" value="{{ current_user.username }}" disabled>
            </div>
          </div>

          <!-- Auction Type Preset -->
          <div class="mb-4">
            <label class="form-label">Auction Type</label>
            <div class="row g-2">
              <div class="col-md-4">
                <input type="radio" class="btn-check" name="auction_type" id="type_mega" value="mega" checked>
                <label class="btn btn-outline-warning w-100 p-3 text-start h-100" for="type_mega">
                  <div class="fw-bold fs-6">IPL Mega Auction</div>
                  <div class="text-muted small">₹120 Cr Purse • 30s Timer • 18-25 Squad</div>
                </label>
              </div>
              <div class="col-md-4">
                <input type="radio" class="btn-check" name="auction_type" id="type_mini" value="mini">
                <label class="btn btn-outline-warning w-100 p-3 text-start h-100" for="type_mini">
                  <div class="fw-bold fs-6">IPL Mini Auction</div>
                  <div class="text-muted small">₹50 Cr Purse • 20s Timer • Fast Paced</div>
                </label>
              </div>
              <div class="col-md-4">
                <input type="radio" class="btn-check" name="auction_type" id="type_custom" value="custom">
                <label class="btn btn-outline-warning w-100 p-3 text-start h-100" for="type_custom">
                  <div class="fw-bold fs-6">Custom Auction</div>
                  <div class="text-muted small">Fully customizable rules & budgets</div>
                </label>
              </div>
            </div>
          </div>

          <!-- Detailed Rules Grid -->
          <div class="p-3 rounded-3 bg-dark border border-secondary mb-4">
            <h5 class="text-warning fw-bold mb-3"><i class="fa-solid fa-sliders me-2"></i>Auction Rules & Limits</h5>
            
            <div class="row g-3">
              <div class="col-md-6">
                <label for="starting_budget" class="form-label">Starting Purse Per Franchise (₹ Crores)</label>
                <div class="input-group">
                  <span class="input-group-text bg-secondary text-white border-0">₹</span>
                  <input type="number" class="form-control" id="starting_budget" name="starting_budget" value="120" min="20" max="250" step="1" required>
                  <span class="input-group-text bg-secondary text-white border-0">Cr</span>
                </div>
              </div>

              <div class="col-md-6">
                <label for="max_teams" class="form-label">Max Teams (2 to 10)</label>
                <select class="form-select" id="max_teams" name="max_teams">
                  <option value="2">2 Teams (1v1 Duel)</option>
                  <option value="4">4 Teams</option>
                  <option value="6">6 Teams</option>
                  <option value="8">8 Teams</option>
                  <option value="10" selected>10 Teams (Full IPL)</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="timer_duration" class="form-label">Auction Bidding Mode</label>
                <select class="form-select" id="timer_duration" name="timer_duration">
                  <option value="0" selected>Auctioneer Hammer (No Timer / Host Controls)</option>
                  <option value="30">30 Seconds (Timer)</option>
                  <option value="60">60 Seconds (Timer)</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="min_squad_size" class="form-label">Min Squad Size</label>
                <input type="number" class="form-control" id="min_squad_size" name="min_squad_size" value="18" min="11" max="22">
              </div>

              <div class="col-md-4">
                <label for="max_squad_size" class="form-label">Max Squad Size</label>
                <input type="number" class="form-control" id="max_squad_size" name="max_squad_size" value="25" min="15" max="30">
              </div>

              <div class="col-md-4">
                <label for="max_overseas" class="form-label">Max Overseas Players</label>
                <input type="number" class="form-control" id="max_overseas" name="max_overseas" value="8" min="4" max="10">
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('auction.dashboard') }}" class="btn btn-stadium px-4">Cancel</a>
            <button type="submit" class="btn btn-gold btn-lg px-5">
              <i class="fa-solid fa-rocket me-2"></i> Create Room & Enter Lobby
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Presets switcher
  document.querySelectorAll('input[name="auction_type"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const type = e.target.value;
      const budgetInput = document.getElementById('starting_budget');
      const timerInput = document.getElementById('timer_duration');
      const minSquad = document.getElementById('min_squad_size');
      const maxSquad = document.getElementById('max_squad_size');

      if (type === 'mega') {
        budgetInput.value = 120;
        timerInput.value = 30;
        minSquad.value = 18;
        maxSquad.value = 25;
      } else if (type === 'mini') {
        budgetInput.value = 50;
        timerInput.value = 20;
        minSquad.value = 18;
        maxSquad.value = 25;
      } else {
        budgetInput.value = 100;
        timerInput.value = 30;
      }
    });
  });
</script>
{% endblock %}
